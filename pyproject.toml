[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlas-books"
version = "0.1.0"
description = "Atlas: a map of your books (by description) that you explore together with an AI librarian, on one shared FlexViz state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
authors = [{ name = "Cedric Helewaut" }]
keywords = ["books", "umap", "embeddings", "recommendations", "flexviz", "ollama", "visualisation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
]
dependencies = [
  "flexviz>=0.1.0b5",
  "fastapi>=0.135",
  "uvicorn>=0.41",
  "polars>=1.44.1,<1.50",
  "numpy>=1.26",
  "pyarrow>=17",
  "fastembed>=0.5",
  "umap-learn>=0.5.6",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
faiss = ["faiss-cpu>=1.8"]
st = ["sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atlas = "atlas_books.cli:main"

[project.urls]
Homepage = "https://github.com/cedrichelewaut/atlas"
Issues = "https://github.com/cedrichelewaut/atlas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_books"]

[tool.hatch.build.targets.sdist]
include = ["src/atlas_books", "README.md", "LICENSE", "NOTICE.md", "tests", "install.sh", "Dockerfile"]
